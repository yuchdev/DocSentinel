[project]
name = "docsentinel"
version = "0.1.0"
description = "Deterministic-first documentation inventory and future QA framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flakeforge==1.1.0",
    "release-saga==1.2.0",
]

[project.scripts]
docsentinel = "docsentinel.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/docsentinel"]
