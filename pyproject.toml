[project]
name = "docsentinel"
version = "0.1.0"
description = "Deterministic-first documentation inventory and future QA framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flakeforge==1.1.0",
    "release-saga==1.2.0",
    "spacy>=3.8.16",
]

[project.scripts]
docsentinel = "docsentinel.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]
standard = ["scikit-learn>=1.4", "textstat>=0.7", "docsig>=0.96"]
deep = ["spacy>=3.7", "textacy>=0.13"]

[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: Unit tests exercising pure logic in isolation",
    "mock: Tests exercising units with mocked external collaborators",
    "integration: Integration tests exercising multiple real components",
    "e2e: End-to-end journey tests exercising complete entry points",
]

[tool.hatch.build.targets.wheel]
packages = ["src/docsentinel"]

[tool.flakeforge]
include = ["src", "tests", "scripts"]
exclude = [".venv", "build", ".build", "dist", ".dist", "tests/assets"]

# select = []
# ignore = []

# When false, a `# noqa` comment never suppresses a violation (the rule
# engine's noqa support is bypassed entirely). Default true.
allow_noqa = true

# Whitelist: when non-empty, only files/directories listed here may use `# noqa`.
# When empty, all files not in `noqa_forbidden` are permitted.
noqa_allowed = []

# Blacklist: files/directories where `# noqa` is strictly forbidden (violations always fire).
# Blacklist always wins over `noqa_allowed`.
noqa_forbidden = []
